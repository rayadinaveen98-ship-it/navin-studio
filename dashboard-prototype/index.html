const art=(project)=>project.art?`url('${artwork[project.art]}')`:`linear-gradient(135deg,${project.color}33,#172038 70%)`;
const escapeHTML=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countDone=p=>p.done.filter(Boolean).length;
const totalDone=()=>state.projects.reduce((a,p)=>a+countDone(p),0);
const totalTasks=()=>state.projects.reduce((a,p)=>a+p.done.length,0);
const pct=p=>Math.round(100*countDone(p)/p.done.length);
const overall=()=>Math.round(totalDone()/totalTasks()*100)||0;
const doneCount=()=>state.projects.filter(p=>p.done.every(Boolean)).length;
const catCount=c=>state.projects.filter(p=>p.cat===c).length;
function phase(p){if(p.done.every(Boolean))return 'Review ready';if(pct(p)>=50)return 'In motion';if(pct(p)>0)return 'Planning';return 'Not started';}
function tagPhase(p){let ph=phase(p);return `<span class="tag ${ph==='Review ready'?'green':ph==='In motion'?'blue':ph==='Planning'?'purple':''}">${ph}</span>`;}
function infoNotice(){return `<div class="notice">${icon('alert-triangle')} <strong>Sample workspace.</strong> All project milestones, checkboxes, pipeline states and trend charts are fictional demonstration data. This prototype reads or changes no actual projects, APKs, accounts or releases.</div>`;}
function projectIcon(p){return `<span class="project-icon ${p.art?'has-image':''}" style="background-image:${art(p)}"><span>${escapeHTML(p.initial)}</span></span>`;}
function pRow(p){return `<button type="button" class="project-row" data-action="project" data-id="${p.id}" aria-label="Open ${p.name} sample details">${projectIcon(p)}<span class="p-row-info"><span class="p-name">${p.name}</span><span class="p-description ellipsis">${p.type}</span></span><span class="progress-group"><div class="progress-bar"><div class="progress-fill" style="width:${pct(p)}%"></div></div><div class="progress-number count">${pct(p)}% <span class="dim">demo</span></div></span><span class="row-stage">${tagPhase(p)}</span></button>`;}
function panelHead(title,description,ic,aside=''){return `<div class="panel-heading"><div class="heading-stack"><span class="heading-icon">${icon(ic)}</span><div class="heading-copy"><h2>${title}</h2><p>${description}</p></div></div>${aside}</div>`;}
function btn(label,action,extra='',ic=''){return `<button class="button ${extra}" data-action="${action}">${ic?icon(ic):''}${label}</button>`;}
function titleBar(name,desc,actions=''){return `<div class="section-head"><div><span class="eyebrow">CREATOR COMMAND CENTER · PREVIEW</span><h1 style="margin-top:8px">${name}</h1><p>${desc}</p></div><div class="section-actions">${actions}</div></div>`;}
function emptyWorkspace(){return `<div class="panel empty-center" style="min-height:420px;padding:30px"><div class="skeleton-empty" style="max-width:430px;border:0;background:none">${icon('database')}<strong>No connected workspace data</strong><p>This is the honest state before authentication and integrations. The dashboard does not know your actual builds, releases, roadmaps or analytics.</p><div class="top-gap">${btn('Explore sample workspace','sample-on','primary','play')}</div></div></div>`;}
function stats(){let completed=totalDone(),projects=state.projects.length;let values=[['Sample projects',projects,'layers',`${completed}/${totalTasks()} illustrative milestones`],['Milestones checked',completed,'check-circle','Changed in this browser only'],['Review ready',doneCount(),'shield-check','Not a real QA result'],['Published releases',0,'package','No verified data connected']];return `<div class="stat-grid">${values.map((s,i)=>`<button type="button" class="stat-card" data-action="${i===3?'releases':i===0?'projects':i===1?'roadmap':'builds'}"><span class="stat-icon">${icon(s[2])}</span><span><strong class="stat-num count">${s[1]}</strong><span class="stat-label">${s[0]}</span><span class="stat-sub">${s[3]}</span></span></button>`).join('')}</div>`;}
function projectPanel(){let filtered=state.projects.filter(p=>state.projectFilter==='all'||(state.projectFilter==='ready'&&p.done.every(Boolean))||(state.projectFilter==='inmotion'&&phase(p)==='In motion')||(state.projectFilter==='planning'&&phase(p)==='Planning'));return `<section class="panel">${panelHead('Project Roadmap','Interactive, sample milestone data','map',`<div class="segmented" role="group" aria-label="Filter roadmap"><button data-action="project-filter" data-value="all" class="${state.projectFilter==='all'?'active':''}">All</button><button data-action="project-filter" data-value="inmotion" class="${state.projectFilter==='inmotion'?'active':''}">In motion</button><button data-action="project-filter" data-value="ready" class="${state.projectFilter==='ready'?'active':''}">Ready</button></div>`)}<div class="project-list">${filtered.length?filtered.slice(0,6).map(pRow).join(''):`<div class="skeleton-empty"><p>No sample projects in this filter yet.</p></div>`}</div><div class="panel-content">${btn('Explore every project','projects','ghost','arrow-right')}</div></section>`;}
function milestonePanel(){return `<section class="panel">${panelHead('Milestone Progress','Computed from interactive sample checks','circle-dot',`<span class="tag purple">SIMULATED</span>`)}<div class="panel-content"><div class="row" style="justify-content:center;gap:20px;flex-wrap:wrap;margin:10px 0 9px"><div class="progress-ring" style="--angle:${Math.round(overall()*3.6)}"><div class="ring-inner"><strong class="count">${overall()}%</strong><span>of sample tasks</span></div></div><div class="legend" style="min-width:110px"><div class="legend-line"><span class="legend-dot" style="background:#75a5ff"></span>Checked<strong class="count">${totalDone()}</strong></div><div class="legend-line"><span class="legend-dot" style="background:#7c638e"></span>Remaining<strong class="count">${totalTasks()-totalDone()}</strong></div><div class="legend-line"><span class="legend-dot" style="background:#68dfaa"></span>Ready<strong class="count">${doneCount()}</strong></div></div></div><div class="fineprint">These milestones are fictional prototype tasks, not measured development progress.</div></div></section>`;}
function gatePanel(compact=false){let done=state.gate.size;return `<section class="panel">${panelHead('Release Readiness','Owner approval workflow, local simulation','rocket',`<span class="tag ${state.approved?'green':'orange'}">${state.approved?'Demo approved':'Not published'}</span>`)}<div class="panel-content"><div class="row between"><span class="small"><strong>Sample release candidate</strong></span><span class="gate-status ${done===gateLabels.length?'ok':''}">${done}/${gateLabels.length} checks</span></div><div class="gate-list">${gateLabels.map((txt,i)=>`<label class="gate-item"><input type="checkbox" data-check="${i}" ${state.gate.has(i)?'checked':''} ${state.approved?'disabled':''}><span>${txt}</span></label>`).join('')}</div><button class="button primary gate-action" data-action="approve" ${done<gateLabels.length||state.approved?'disabled':''}>${icon(state.approved?'check-circle':'shield-check')} ${state.approved?'Simulated approval recorded':'Simulate approval'}</button>${state.approved?`<div class="notice green top-gap">${icon('info')} Approved <strong>inside this local prototype only.</strong> No APK was uploaded, signed, released, or published.</div>`:''}<div class="fineprint">A future release system must verify real build evidence and require owner approval before changing a public version.</div></div></section>`;}
function qaPanel(){const qaSteps=[['Source','Git SHA / tag','folder'],['Build','CI artifact','terminal'],['Checks','Signature & hash','shield-check'],['Approval','Owner decision','file-check']];return `<section class="panel">${panelHead('Release Pipeline','A proposed verification sequence, not connected','shield-check',`<span class="tag purple">SANDBOX</span>`)}<div class="panel-content"><div class="qa-steps">${qaSteps.map((step,i)=>`<div class="qa-step ${state.qaPass&&i<3?'complete':''}">${icon(step[2])}<strong>${step[0]}</strong><small>${step[1]}</small></div>`).join('')}</div><div class="row between" style="flex-wrap:wrap"><span class="tiny muted">${state.qaPass?'3 sample checks marked complete':'No real build evidence connected'}</span>${btn(state.qaPass?'Reset demo checks':'Run demo checks',state.qaPass?'qa-reset':'qa-run','smallbtn','activity')}</div></div></section>`;}
function analyticsPanel(){return `<section class="panel">${panelHead('Analytics Preview','Fictional trend, not connected to analytics','chart-no-axes-combined',`<span class="tag purple">DEMO DATA</span>`)}<div class="panel-content"><div class="metric-strip"><div class="metric"><strong>—</strong><small>Real visitors · not connected</small></div><div class="metric"><strong>—</strong><small>Real downloads · not connected</small></div></div>${chart(14)}<div class="chart-legend"><span class="chart-key"><span></span>Illustrative engagement</span><button class="subtle-link" data-action="analytics">Open report</button></div></div></section>`;}
function chart(bars=22){let n=bars;return `<div class="chart-box" role="img" aria-label="Sample illustrative chart, not real analytics">${Array.from({length:n},(_,i)=>{let v=22+Math.round((i/n)*51+Math.sin(i*1.7)*13+Math.cos(i*.7)*12);return `<span class="chart-col" style="height:${Math.min(90,Math.max(8,v))}%" title="Illustrative point ${i+1}"></span>`;}).join('')}</div><div class="chart-ticks"><span>Start</span><span>Middle</span><span>Now (illustrative)</span></div>`;}
function activityPanel(){let rows=state.activity.length?state.activity.slice(0,4):[{title:'Foundation documented',sub:'Product brief and data boundaries prepared',when:'08 Nov 2026'},{title:'Public web prototype',sub:'Interactive design prepared for review',when:'08 Nov 2026'},{title:'Mobile experience prototype',sub:'Mobile interaction review prepared',when:'08 Nov 2026'}];return `<section class="panel">${panelHead('Studio Activity','Confirmed foundation + local interactions','clock',`<button class="subtle-link" data-action="journal">View all ${icon('arrow-right')}</button>`)}<div class="activity-list">${rows.map((it,i)=>`<div class="activity-row"><span class="activity-dot"></span><div class="flex1"><strong>${it.title}</strong><small>${it.sub}</small></div><time>${it.when}</time></div>`).join('')}</div></section>`;}
function timelinePanel(){let steps=[['Foundation','Product brief','Release rules'],['Visual design','Public web prototype','Mobile prototype'],['Private dashboard','Interactive review','Owner approval pending'],['Implementation','Integrations later','Verified releases later']];return `<section class="panel" style="margin-top:14px">${panelHead('Studio Journey','Documented phases, not a delivery forecast','calendar',`<span class="tag">2026 · PROJECT HISTORY</span>`)}<div class="timeline">${steps.map((x,i)=>`<div class="timeline-card"><h4>${x[0]}</h4><p>${icon(i===0?'check-circle':i===1?'check-circle':'circle-dot')}${x[1]}</p><p>${icon(i<2?'check-circle':'circle-dot')}${x[2]}</p></div>`).join('')}</div></section>`;}
function home(){return `<div class="content"><div class="hero"><div class="hero-inner"><div class="eyebrow">STUDIO HEADQUARTERS · INTERACTIVE PREVIEW</div><h1>Everything we're building.<br>One clear view.</h1><p>Explore the projects, roadmaps and release gates that could power our private studio headquarters.</p><div class="hero-controls"><span class="mode-chip">${icon('sparkles')} SANDBOX · SAMPLE DATA</span>${btn('Explore roadmap','roadmap','ghost','arrow-right')}${btn('How this works','tour','ghost','help-circle')}</div></div></div>${stats()}<div class="overview-grid"><div class="stack">${projectPanel()}${qaPanel()}</div><div class="stack">${milestonePanel()}${gatePanel(true)}</div><div class="stack">${analyticsPanel()}${activityPanel()}</div></div>${timelinePanel()}<p class="footer-note">NAVIN STUDIO · Experience prototype v0.1 · All operational data on this screen is illustrative unless explicitly sourced</p></div>`;}
function projectsView(){let cats=['all','apps','games','films','stories','learning'];let filtered=state.projects.filter(p=>(state.listFilter==='all'||p.cat===state.listFilter)&&`${p.name} ${p.type} ${p.desc}`.toLowerCase().includes(state.listSearch.toLowerCase()));return `${titleBar('Project Directory','Explore every sample project and inspect its staged milestones.',`<span class="tag purple">${filtered.length} illustrated projects</span>`)}<section class="panel panel-inner"><div class="table-controls"><div class="row flex1" style="flex-wrap:wrap">${cats.map(c=>`<button class="button smallbtn ${c===state.listFilter?'tab-on':'ghost'}" data-action="catalog-filter" data-value="${c}">${c==='all'?'All':c[0].toUpperCase()+c.slice(1)}</button>`).join('')}</div><label style="display:flex;align-items:center;gap:8px;max-width:200px">${icon('search')}<input class="input" id="projectQuery" aria-label="Search project names" placeholder="Find a project" value="${escapeHTML(state.listSearch)}" /></label></div><div class="project-card-grid">${filtered.map(p=>`<button class="large-project" data-action="project" data-id="${p.id}" aria-label="Inspect ${p.name}"><div class="project-cover" style="background-image:${art(p)}"></div><div class="project-details"><div class="row between"><h3>${p.name}</h3><span class="tag">${p.type}</span></div><p>${p.desc}</p><div class="project-meta">${tagPhase(p)}<span class="tiny muted">${countDone(p)}/${p.milestones.length} sample tasks ${icon('arrow-right')}</span></div></div></button>`).join('')||`<div class="skeleton-empty">${icon('search')}<strong>No matching projects</strong><p>Adjust the category or query.</p></div>`}</div></section>`;}
function roadmapView(){let filtered=state.projects.filter(p=>state.roadmapFilter==='all'||state.roadmapFilter===p.cat);return `${titleBar('Creative Roadmap','Sample milestones are editable here; every change stays in this browser.',btn('Reset sample milestones','reset-roadmap','ghost','rotate-ccw'))}<div class="notice blue" style="margin-bottom:15px">${icon('info')} Click any milestone to update the overview progress cards. These checklists are illustrative, not real Backlot or Frame One project records.</div><div class="two-col"><section class="panel panel-inner"><div class="row between wrap" style="margin-bottom:15px"><h2>Milestone planner</h2><label class="row small muted">Category <select class="select" id="roadmapFilter">${['all','apps','games','films','stories','learning'].map(s=>`<option value="${s}" ${state.roadmapFilter===s?'selected':''}>${s==='all'?'All':s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></label></div><div class="roadmap-list">${filtered.map(p=>`<div class="roadmap-card"><div class="row between"><div class="row">${projectIcon(p)}<div><strong>${p.name}</strong><div class="tiny muted">${countDone(p)}/${p.done.length} sample milestones</div></div></div>${tagPhase(p)}</div><div class="milestone-list">${p.milestones.map((m,i)=>`<div class="milestone-item ${p.done[i]?'checked':''}"><input type="checkbox" id="ms-${p.id}-${i}" data-milestone="${p.id}:${i}" ${p.done[i]?'checked':''}><label for="ms-${p.id}-${i}">${m}</label></div>`).join('')}</div></div>`).join('')}</div></section><div class="approval-side">${milestonePanel()}${activityPanel()}</div></div>`;}
function releaseView(){return `${titleBar('Release Desk','An owner-controlled, verifiable publishing workflow.',btn('View QA pipeline','builds','ghost','shield-check'))}<div class="two-col"><section class="panel panel-inner"><div class="row between wrap" style="margin-bottom:14px"><h2>Public release registry</h2><span class="tag orange">None verified</span></div><div class="skeleton-empty" style="padding:44px 15px">${icon('package')}<strong>No verified releases connected</strong><p>We won't invent APK versions, download links, signatures, build outcomes or release dates.</p></div><div class="notice blue top-gap">${icon('info')} To show a real release here later, we need an approved source tag, downloadable artifact, SHA-256, signature checks and tested changelog.</div><div class="top-gap-lg"><h3>Candidate lifecycle</h3><div class="list-row"><span class="bullet-step">01</span><div><strong>Build identified</strong><div class="tiny muted">Exact commit, version and artifact recorded</div></div></div><div class="list-row"><span class="bullet-step">02</span><div><strong>Quality and signing checks</strong><div class="tiny muted">Tests, provenance and checksums verified</div></div></div><div class="list-row"><span class="bullet-step">03</span><div><strong>Owner approval</strong><div class="tiny muted">Explicit publish decision for one release</div></div></div><div class="list-row"><span class="bullet-step">04</span><div><strong>Public listing</strong><div class="tiny muted">Only then can the site display a version and download</div></div></div></div></section>${gatePanel()}</div>`;}
function buildsView(){return `${titleBar('Builds & Quality','A preview of the release evidence we will require from future integrations.',btn('Open release desk','releases','ghost','arrow-right'))}<div class="two-col"><div class="stack">${qaPanel()}<section class="panel panel-inner"><h2>Connected build services</h2><div class="skeleton-empty top-gap-lg">${icon('database')}<strong>Not connected</strong><p>No GitHub Actions job, signature, test suite or APK has been fetched. The pipeline above is a simulation.</p></div></section></div><section class="panel panel-inner"><h2>QA evidence requirements</h2><p class="muted small top-gap" style="line-height:1.7">Real release checks should be auditable, reproducible and tied to exact immutable artifacts.</p>${['Source repository and commit SHA','Exact build package and version','Tested installation and app launch','Signature fingerprint and SHA-256','QA suite, device and environment','Approved changelog and publication'].map((s,i)=>`<div class="list-row"><span class="bullet-step">0${i+1}</span><span>${s}</span><span class="tag" style="margin-left:auto">Future</span></div>`).join('')}</section></div>`;}
function analyticsView(){return `${titleBar('Studio Insights','Performance and growth without making up actual metrics.',`<span class="tag purple">Illustrative visualization</span>`)}<div class="metric-strip" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px"><div class="panel panel-inner"><span class="muted tiny">Real audience growth</span><h1 style="margin:10px 0">—</h1><small class="dim">No connected analytics provider</small></div><div class="panel panel-inner"><span class="muted tiny">Real published downloads</span><h1 style="margin:10px 0">—</h1><small class="dim">No release distribution telemetry</small></div><div class="panel panel-inner"><span class="muted tiny">Real project performance</span><h1 style="margin:10px 0">—</h1><small class="dim">No verified source available</small></div></div><div class="two-col"><section class="panel panel-inner"><div class="row between wrap"><div><h2>Visual chart sample</h2><p class="muted tiny top-gap">Synthetic values only · UI exploration</p></div><label class="row muted small">Range <select class="select" id="periodSelect"><option value="7" ${state.period==='7'?'selected':''}>7 days</option><option value="30" ${state.period==='30'?'selected':''}>30 days</option><option value="90" ${state.period==='90'?'selected':''}>90 days</option></select></label></div><div class="chart-big">${chart(state.period==='7'?7:state.period==='30'?22:29)}</div><div class="notice top-gap">${icon('info')} Chart values are procedurally generated to test visual density. Do not interpret them as visitor, revenue or download data.</div></section><section class="panel panel-inner"><h2>Future analytics sources</h2>${[['Web traffic','Privacy-conscious analytics'],['App downloads','Published release assets'],['Creator reach','Authorized video platform data'],['Build quality','CI and QA artifacts']].map(([a,b])=>`<div class="list-row">${icon('database')}<div><strong>${a}</strong><div class="muted tiny">${b}</div></div><span class="tag" style="margin-left:auto">Not connected</span></div>`).join('')}</section></div>`;}
function journalView(){return `${titleBar('Studio Journal','What we know from project history, and what is simulated here.',btn('Explore roadmap','roadmap','ghost','map'))}<div class="two-col"><section class="panel panel-inner activity-tall"><div class="row between"><h2>Milestone history</h2><span class="tag">08 NOV 2026</span></div>${[{title:'Foundation and repository established',sub:'A public repository and written product boundaries were created.',when:'Foundation'},{title:'Public website experience prototyped',sub:'Interactive studio website prepared and approved as design direction.',when:'Web'},{title:'Mobile app experience prototyped',sub:'Separate mobile-first interaction review was completed.',when:'Mobile'},{title:'Command Center prototype',sub:'This dashboard is a local illustrative experience, not a live admin system.',when:'Now'}].map(r=>`<div class="activity-row"><span class="activity-dot"></span><div class="flex1"><strong>${r.title}</strong><small>${r.sub}</small></div><time>${r.when}</time></div>`).join('')}</section><section class="panel panel-inner"><h2>Local demo changes</h2>${state.activity.length?state.activity.map(r=>`<div class="activity-row"><span class="activity-dot"></span><div class="flex1"><strong>${r.title}</strong><small>${r.sub}</small></div><time>${r.when}</time></div>`).join(''):`<div class="skeleton-empty top-gap-lg">${icon('clock')}<strong>No edits in this demo session</strong><p>Try checking a milestone or the release simulation, then return here.</p></div>`}<div class="top-gap">${btn('Reset demo activity','reset-activity','ghost','rotate-ccw')}</div></section></div>`;}
function settingsView(){const toggle=(key,title,desc)=>`<div class="setting-row"><div><strong>${title}</strong><small>${desc}</small></div><label class="toggle"><input type="checkbox" data-setting="${key}" ${state[key]?'checked':''} aria-label="${title}"><span></span></label></div>`;return `${titleBar('Studio Preferences','Tune how this private dashboard concept feels. These are local browser preferences.',btn('Reset all demo content','reset-everything','danger','rotate-ccw'))}<div class="settings-grid"><section class="panel panel-inner"><h2>Appearance & interaction</h2>${toggle('compact','Compact workspace','Tighten spacing to display more content.')}${toggle('noArt','Minimal artwork','Replace cinematic image backgrounds with gradients.')}${toggle('reduced','Reduce motion','Disable transitions and animated overlays.')}<div class="notice blue top-gap">${icon('info')} This prototype has no login, account, private data store, or server. It cannot replace an authenticated owner dashboard.</div></section><section class="panel panel-inner"><h2>Prototype & trust</h2><div class="setting-row"><div><strong>Local simulation</strong><small>${state.demo?'Sample roadmap and workflow active.':'Empty dashboard state active.'}</small></div>${btn(state.demo?'Show empty state':'Enable sample data',state.demo?'sample-off':'sample-on','smallbtn','eye')}</div><div class="list-row">${icon('lock')}<div><strong>Authentication</strong><small class="muted">Not implemented</small></div></div><div class="list-row">${icon('database')}<div><strong>External integrations</strong><small class="muted">None — zero network requests</small></div></div><div class="list-row">${icon('shield-check')}<div><strong>Publishing permissions</strong><small class="muted">No write access; all approval simulations are local</small></div></div><div class="top-gap-lg">${btn('Read the prototype guide','tour','ghost','help-circle')}</div></section></div>`;}
function render(){document.body.classList.toggle('reduce-motion',state.reduced);document.body.classList.toggle('compact',state.compact);document.body.classList.toggle('no-art',state.noArt);document.getElementById('breadCurrent').textContent=pages.find(p=>p[0]===state.page)?.[1]||(spaces.find(p=>p[0]===state.page)?.[1])||'Overview';let view; if(state.page==='overview')view=state.demo?home():`<div class="content">${titleBar('Creator Command Center','Real integrations aren’t connected yet.')} ${emptyWorkspace()}</div>`; else if(state.page==='settings')view=`<div class="content">${settingsView()}</div>`; else if(!state.demo)view=`<div class="content">${titleBar((pages.find(p=>p[0]===state.page)||spaces.find(p=>p[0]===state.page)||['','Studio'])[1],'No connected project information is available.')} ${emptyWorkspace()}</div>`; else if(state.page==='projects')view=`<div class="content">${projectsView()}</div>`; else if(state.page==='roadmap')view=`<div class="content">${roadmapView()}</div>`; else if(state.page==='releases')view=`<div class="content">${releaseView()}</div>`; else if(state.page==='builds')view=`<div class="content">${buildsView()}</div>`; else if(state.page==='analytics')view=`<div class="content">${analyticsView()}</div>`; else if(state.page==='journal')view=`<div class="content">${journalView()}</div>`; else if(spaces.some(s=>s[0]===state.page))view=`<div class="content">${titleBar(`${spaces.find(s=>s[0]===state.page)?.[1]} Workspace`,'Explore matching sample projects in this category.',btn('All projects','projects','ghost','arrow-right'))}<div class="project-card-grid">${state.projects.filter(p=>p.cat===state.page).map(p=>`<button class="large-project" data-action="project" data-id="${p.id}"><div class="project-cover" style="background-image:${art(p)}"></div><div class="project-details"><h3>${p.name}</h3><p>${p.desc}</p>${tagPhase(p)}</div></button>`).join('')}</div></div>`; else view=`<div class="content">${home()}</div>`;document.getElementById('mainContent').innerHTML=view; icons(document.getElementById('mainContent'));navActive();document.title=`${document.getElementById('breadCurrent').textContent} — NAVIN STUDIO Prototype`;
}
function initNav(){document.getElementById('navMain').innerHTML=pages.map(([id,name,ic])=>`<button class="nav-item" data-action="nav" data-value="${id}" aria-label="${name}">${icon(ic)}<span>${name}</span>${id==='releases'?'<span class="nav-extra">0</span>':''}</button>`).join('');document.getElementById('navSpaces').innerHTML=spaces.map(([id,name,ic])=>`<button class="nav-item" data-action="nav" data-value="${id}">${icon(ic)}<span>${name}</span></button>`).join('');icons(document.getElementById('sidebar'));}
function navActive(){document.querySelectorAll('.nav-item').forEach(el=>{let active=el.dataset.value===state.page;el.classList.toggle('active',active);active?el.setAttribute('aria-current','page'):el.removeAttribute('aria-current');});}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');let s=document.getElementById('mobileShade');s.hidden=true;document.getElementById('menuBtn').setAttribute('aria-expanded','false');}
function nav(id){const allowed=[...pages,...spaces].some(p=>p[0]===id);state.page=allowed?id:'overview';location.hash=state.page;closeMenu();render();document.getElementById('mainContent').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function localActivity(title,sub){state.activity.unshift({title,sub,when:'Just now'});state.activity=state.activity.slice(0,15);}
function persistPreferences(){try{localStorage.setItem('navin-studio-dashboard-preferences',JSON.stringify({compact:state.compact,noArt:state.noArt,reduced:state.reduced}));}catch{}}
function toast(msg){let el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('check-circle')}<span></span>`;el.querySelector('span:last-child').textContent=msg;document.getElementById('toastStack').append(el);icons(el);setTimeout(()=>el.remove(),3600);}
function modal(markup,style){state.lastFocus=document.activeElement;const root=document.getElementById('modalRoot');root.hidden=false;root.innerHTML=markup;icons(root);root.setAttribute('role','presentation');root.querySelector('button, input')?.focus();}
function closeModal(){let root=document.getElementById('modalRoot');root.hidden=true;root.innerHTML='';state.openProject=null;if(state.lastFocus&&document.contains(state.lastFocus))state.lastFocus.focus();}
function detail(id){let p=state.projects.find(x=>x.id===id);if(!p)return;state.openProject=id;modal(`<div class="drawer-bg" data-action="close-on-backdrop"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${p.name} sample details"><div class="drawer-hero" style="background-image:${art(p)}"><button class="icon-button drawer-close" data-action="close-modal" aria-label="Close details">${icon('x')}</button></div><div class="drawer-body"><div class="row between"><span class="tag purple">${p.type} · DEMO</span>${tagPhase(p)}</div><h2 style="margin-top:14px">${p.name}</h2><p>${p.desc} <strong>All milestone values are for interaction testing, not verified project status.</strong></p><div class="row between"><strong>Sample task progress</strong><span class="muted count">${countDone(p)}/${p.milestones.length} checked · ${pct(p)}%</span></div><div class="progress-bar top-gap" style="height:8px"><div class="progress-fill" style="width:${pct(p)}%"></div></div><div class="drawer-section"><h3>Illustrative milestones</h3><div class="milestone-list">${p.milestones.map((m,i)=>`<div class="milestone-item ${p.done[i]?'checked':''}"><input type="checkbox" data-milestone="${p.id}:${i}" id="drawer-ms-${i}" ${p.done[i]?'checked':''}><label for="drawer-ms-${i}">${m}</label></div>`).join('')}</div></div><div class="drawer-section"><div class="notice blue">${icon('info')} This preview has no live GitHub status, release, APK or project metrics.</div></div><div class="drawer-actions">${btn('Project roadmap','open-project-roadmap','primary','map')}${btn('Release desk','releases','ghost','package')}${btn('Close','close-modal','ghost','x')}</div></div></aside></div>`);}
function search(){modal(`<div class="search-modal" role="dialog" aria-modal="true" aria-label="Search command center"><div class="search-top">${icon('search')}<input id="globalSearch" type="text" autocomplete="off" placeholder="Search projects, sections and actions…" aria-label="Search projects and sections"/><button class="icon-button" data-action="close-modal" aria-label="Close search">${icon('x')}</button></div><div class="search-results" id="searchResults"></div><div class="row between muted tiny" style="padding:9px 16px;border-top:1px solid #34405b"><span>Try “Backlot”, “QA”, or “Roadmap”</span><span>Esc to close</span></div></div>`);document.getElementById('globalSearch')?.focus();searchResults('');}
function searchResults(query){let root=document.getElementById('searchResults');if(!root)return;const q=query.trim().toLowerCase();let projectResults=state.projects.filter(p=>!q||`${p.name} ${p.type} ${p.desc}`.toLowerCase().includes(q)).slice(0,7);let navResults=pages.filter(p=>!q||p[1].toLowerCase().includes(q)).slice(0,6);root.innerHTML=`<div class="tiny dim" style="padding:10px 12px 5px">SECTIONS</div>${navResults.map(p=>`<button class="search-result" data-action="search-nav" data-value="${p[0]}">${icon(p[2])}<div><strong>${p[1]}</strong><small>Go to workspace screen</small></div>${icon('arrow-right')}</button>`).join('')}${state.demo?`<div class="tiny dim" style="padding:15px 12px 5px">SAMPLE PROJECTS</div>${projectResults.map(p=>`<button class="search-result" data-action="search-project" data-id="${p.id}">${projectIcon(p)}<div><strong>${p.name}</strong><small>${p.type} · illustrative progress</small></div>${icon('arrow-right')}</button>`).join('')}`:''}${!projectResults.length&&!navResults.length?`<div class="skeleton-empty">No matching results</div>`:''}`;icons(root);}
function tour(){modal(`<div class="tour-modal" role="dialog" aria-modal="true" aria-label="Prototype guide"><div class="row between" style="margin-bottom:13px"><span class="eyebrow">GUIDED STUDIO TOUR</span><button class="icon-button" data-action="close-modal" aria-label="Close guide">${icon('x')}</button></div><h2>Your studio, before we build it.</h2><p>This is a <strong>local interactive prototype</strong> of a future private dashboard. It is not a live administrative service and contains no confidential project data.</p><ol><li><strong>Overview:</strong> inspect cinematic panels, project progress and the simulated pipeline.</li><li><strong>Projects:</strong> search categories and open project-detail drawers.</li><li><strong>Roadmap:</strong> check sample milestones and watch progress update.</li><li><strong>Releases:</strong> tick quality gates and simulate owner approval — nothing is published.</li><li><strong>Analytics:</strong> examine how empty live metrics and fictional chart previews coexist transparently.</li><li><strong>Settings:</strong> test compact mode, artwork and reduced motion; switch to an honest empty state.</li></ol><div class="notice top-gap">${icon('shield-check')} No backend calls, no APK uploads, no real analytics, no login credentials and no publish actions. Everything operational shown is sample data.</div><div class="drawer-actions">${btn('Explore projects','tour-projects','primary','arrow-right')}${btn('Close guide','close-modal','ghost')}</div></div>`);}
function notification(){modal(`<div class="tour-modal" role="dialog" aria-modal="true" aria-label="Notifications preview"><div class="row between"><h2>Activity & notifications</h2><button class="icon-button" data-action="close-modal" aria-label="Close notifications">${icon('x')}</button></div><p class="top-gap">No connected alerts are available. The items below are local prototype events, not real GitHub, builds or app notifications.</p>${state.activity.length?state.activity.slice(0,5).map(r=>`<div class="activity-row"><span class="activity-dot"></span><div><strong>${r.title}</strong><small>${r.sub}</small></div></div>`).join(''):`<div class="skeleton-empty top-gap-lg">${icon('bell')}<strong>No demo notifications yet</strong><p>Try changing a roadmap milestone to create a local event.</p></div>`}<div class="drawer-actions">${btn('Activity Journal','notification-journal','primary','book-open')}</div></div>`);}
function account(){modal(`<div class="tour-modal" role="dialog" aria-modal="true" aria-label="Workspace menu"><div class="row between"><h2>Studio workspace</h2><button class="icon-button" data-action="close-modal" aria-label="Close workspace menu">${icon('x')}</button></div><p class="top-gap">This is a self-contained prototype. The “studio owner” header is visual only — no real user identity or permission system is active.</p><div class="notice">${icon('lock')} A production command center would require secure server-side authentication and private data separation.</div><div class="drawer-actions">${btn('Settings','account-settings','ghost','settings')}${btn('Read prototype guide','tour','ghost','help-circle')}</div></div>`);}
function resetProject(){state.projects=JSON.parse(JSON.stringify(initial));state.activity=[];state.gate.clear();state.qaPass=false;state.approved=false;}
function handleAction(el){const a=el.dataset.action,val=el.dataset.value,id=el.dataset.id;
if(a==='nav')return nav(val);
if(pages.some(p=>p[0]===a)||spaces.some(p=>p[0]===a))return closeModal(),nav(a);
if(a==='search-nav')return closeModal(),nav(val);
if(a==='search-project')return detail(id);
if(a==='project')return detail(id);
if(a==='close-modal')return closeModal();
if(a==='close-on-backdrop')return closeModal();
if(a==='project-filter'){state.projectFilter=val;return render();}
if(a==='catalog-filter'){state.listFilter=val;return render();}
if(a==='open-project-roadmap')return closeModal(),nav('roadmap');
if(a==='tour-projects')return closeModal(),nav('projects');
if(a==='notification-journal')return closeModal(),nav('journal');
if(a==='account-settings')return closeModal(),nav('settings');
if(a==='sample-off'){state.demo=false;return render(),toast('Showing the honest, disconnected workspace');}
if(a==='sample-on'){state.demo=true;return render(),toast('Sample data enabled — no real integrations');}
if(a==='qa-run'){state.qaPass=true;localActivity('QA simulation started','Three fictional build checks shown as passed');render();return toast('Demo checks recorded locally only');}
if(a==='qa-reset'){state.qaPass=false;render();return toast('Demo pipeline reset');}
if(a==='approve'){if(state.gate.size===gateLabels.length&&!state.approved){state.approved=true;localActivity('Simulated release approval','Local demonstration only — nothing was published');render();return toast('Simulation only: no public release was created');}return;}
if(a==='reset-roadmap'){state.projects.forEach((p,i)=>p.done=initial[i].done.slice());localActivity('Sample milestones reset','Reverted to initial fictional task states');render();return toast('Illustrative milestones reset');}
if(a==='reset-activity'){state.activity=[];render();return toast('Local activity cleared');}
if(a==='reset-everything'){resetProject();state.demo=true;state.projectFilter='all';state.listSearch='';state.listFilter='all';state.period='30';state.compact=false;state.noArt=false;state.reduced=false;persistPreferences();render();return toast('Local demo state restored');}
if(a==='tour')return tour();
if(a==='search')return search();
}
document.addEventListener('click',event=>{let item=event.target.closest('[data-action]');if(item){if(item.dataset.action==='close-on-backdrop'&&event.target!==item)return;handleAction(item);}});
document.addEventListener('change',event=>{let el=event.target;
if(el.matches('[data-milestone]')){const [id,i]=el.dataset.milestone.split(':');const p=state.projects.find(p=>p.id===id);if(!p)return;p.done[+i]=el.checked;localActivity(`${p.name} · sample task ${el.checked?'checked':'unchecked'}`,p.milestones[+i]);let active=state.openProject;render();if(active)detail(active);else if(el.closest('.milestone-item')){let target=document.getElementById(`ms-${id}-${i}`);target?.focus();}return;}
if(el.matches('[data-check]')){const idx=Number(el.dataset.check);el.checked?state.gate.add(idx):state.gate.delete(idx);state.approved=false;render();return;}
if(el.matches('[data-setting]')){state[el.dataset.setting]=el.checked;persistPreferences();render();return;}
if(el.id==='roadmapFilter'){state.roadmapFilter=el.value;render();return;}
if(el.id==='periodSelect'){state.period=el.value;render();return;}
});
document.addEventListener('input',event=>{if(event.target.id==='globalSearch')searchResults(event.target.value);if(event.target.id==='projectQuery'){const pos=event.target.selectionStart;state.listSearch=event.target.value;let start=window.scrollY;render();const target=document.getElementById('projectQuery');target?.focus();target?.setSelectionRange(pos,pos);window.scrollTo({top:start,behavior:'instant'});}});
document.getElementById('modalRoot').addEventListener('click',event=>{if(event.target.id==='modalRoot')closeModal()});
document.getElementById('searchBtn').addEventListener('click',search);
document.getElementById('notifyBtn').addEventListener('click',notification);
document.getElementById('accountBtn').addEventListener('click',account);
document.getElementById('tourButton').addEventListener('click',tour);
document.getElementById('menuBtn').addEventListener('click',()=>{let side=document.getElementById('sidebar');let open=side.classList.toggle('open');document.getElementById('mobileShade').hidden=!open;document.getElementById('menuBtn').setAttribute('aria-expanded',String(open));});
document.getElementById('mobileShade').addEventListener('click',closeMenu);
document.addEventListener('keydown',event=>{const tag=document.activeElement?.tagName;const typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';if(event.key==='Escape'){if(!document.getElementById('modalRoot').hidden)closeModal();else closeMenu();}if((event.key==='k'&&(event.metaKey||event.ctrlKey))||(event.key==='/'&&!typing)){event.preventDefault();search();}});
window.addEventListener('hashchange',()=>{let page=location.hash.slice(1);if(page&&page!==state.page)nav(page)});
initNav();icons();const first=location.hash.slice(1);state.page=[...pages,...spaces].some(p=>p[0]===first)?first:'overview';render();
})();

</script>
</body>
</html>
